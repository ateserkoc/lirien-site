<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Lirien mix</title>
<meta name="description" content="Someone shared a soundscape with you. Open it in Lirien.">
<meta property="og:title" content="A Lirien mix">
<meta property="og:description" content="Someone shared a soundscape with you. Open it in Lirien.">
<link rel="stylesheet" href="/style.css">
<style>
  .mixname { font-size: 30px; line-height: 1.2; margin: 4px 0 18px; word-break: break-word; }
  .kicker { text-transform: uppercase; letter-spacing: .12em; font-size: 13px; color: var(--muted); }
  .row { display: flex; align-items: center; gap: 14px; padding: 10px 0; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row span { flex: 1; }
  .bar { width: 90px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .btn { display: block; text-align: center; padding: 15px; border-radius: 999px; font-weight: 600; text-decoration: none; margin-top: 12px; }
  .primary { background: var(--accent); color: #fff !important; }
  .secondary { border: 1px solid var(--line); color: var(--accent); }
  .soon { text-align: center; margin-top: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <header><a class="brand" href="/">Lirien</a></header>

  <div id="mix" hidden>
    <div class="kicker" data-t="kicker">Shared mix</div>
    <h1 class="mixname" id="name"></h1>
    <div class="card" id="sounds"></div>
    <a class="btn primary" id="open" data-t="open">Open in Lirien</a>
    <a class="btn secondary" id="store" hidden data-t="store">Get Lirien on the App Store</a>
    <p class="muted soon" id="soon" data-t="soon">Lirien is coming soon to the App Store.</p>
  </div>

  <div id="empty" hidden>
    <h1 data-t="emptyTitle">This mix link looks incomplete.</h1>
    <p class="lead" data-t="emptyText">Ask your friend to share it again from the app.</p>
  </div>

  <footer><p>© 2026 Lirien</p></footer>
</div>
<script>
// App Store yayına girince buraya linkini yaz: "https://apps.apple.com/app/id..."
const APP_STORE_URL = "";

const TR = {
  kicker: "Paylaşılan mix", open: "Lirien'de aç", store: "Lirien'i App Store'dan indir",
  soon: "Lirien yakında App Store'da.", emptyTitle: "Bu mix linki eksik görünüyor.",
  emptyText: "Arkadaşından uygulamadan tekrar paylaşmasını iste."
};
const NAMES = {
  "h.above_the_clouds": "Cloudspire Pass", "h.autumn_red": "Emberwood", "h.beach_party": "Sunhaven Bay",
  "h.city_nights": "Lamplight Quarter", "h.coffee_and_books": "Lantern Library", "h.cozy_winter": "Hearthhollow",
  "h.dark_and_stormy": "Stormwatch Cliffs", "h.dog_relaxation": "Pawmeadow", "h.good_morning": "Dawnmere",
  "h.lucid_dreaming": "Dreaming Tower", "h.meditation": "Still Glade", "h.rainy_day": "Mistwater Quay",
  "h.relax_and_unwind": "Slowtide Cove", "h.sleep_baby_sleep": "Cradle Moon", "h.sleep_well": "Moonhollow",
  "h.star_gazing": "Starwatch Hill", "dog_frequiencies": "Dog frequencies"
};
const pretty = k => NAMES[k] || (k.charAt(0).toUpperCase() + k.slice(1)).replace(/_/g, " ");

const q = new URLSearchParams(location.search);
const s = (q.get("s") || "").split(",").map(p => p.split(":"))
  .filter(p => p.length === 2 && /^(h\.)?[a-z_]{1,40}$/.test(p[0]) && /^\d{1,3}$/.test(p[1])).slice(0, 24);

if (navigator.language && navigator.language.toLowerCase().startsWith("tr")) {
  document.documentElement.lang = "tr";
  document.querySelectorAll("[data-t]").forEach(el => { if (TR[el.dataset.t]) el.textContent = TR[el.dataset.t]; });
}

if (!s.length) {
  document.getElementById("empty").hidden = false;
} else {
  const name = (q.get("n") || "Lirien").slice(0, 40);
  document.getElementById("name").textContent = name;   // textContent: link içeriği HTML olarak işlenmez
  document.title = name + " · Lirien";
  const box = document.getElementById("sounds");
  s.sort((a, b) => b[1] - a[1]).forEach(([k, v]) => {
    const row = document.createElement("div"); row.className = "row";
    const label = document.createElement("span"); label.textContent = pretty(k);
    const bar = document.createElement("div"); bar.className = "bar";
    const fill = document.createElement("i"); fill.style.width = Math.min(+v, 100) + "%";
    bar.appendChild(fill); row.append(label, bar); box.appendChild(row);
  });
  // Uygulama yüklüyse Universal Link zaten uygulamayı açar; bu düğme yedek yol
  document.getElementById("open").href = "lirien://mix?" + new URLSearchParams({ n: name, s: s.map(p => p.join(":")).join(",") });
  if (APP_STORE_URL) {
    const st = document.getElementById("store"); st.href = APP_STORE_URL; st.hidden = false;
    document.getElementById("soon").hidden = true;
  }
  document.getElementById("mix").hidden = false;
}
</script>
</body>
</html>
